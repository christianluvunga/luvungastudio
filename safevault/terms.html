<script>
(function(){
 var titles={fr:"SafeVault – Conditions d'utilisation",en:"SafeVault – Terms of use"};
 function set(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-'+l+']').forEach(function(e){e.innerHTML=e.getAttribute('data-'+l)});
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-set')===l?'true':'false')});
  document.title=titles[l];
 }
 document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){var l=b.getAttribute('data-set');set(l);try{localStorage.setItem('sv-lang',l)}catch(e){}})});
 var l='fr';
 try{l=localStorage.getItem('sv-lang')||''}catch(e){}
 if(l!=='fr'&&l!=='en'){l=((navigator.language||'fr').toLowerCase().indexOf('fr')===0)?'fr':'en'}
 set(l);
})();
</script>
