section{margin-bottom:56px}

footer{border-top:1px solid var(--line);padding:26px 0 40px;text-align:center;color:var(--mut);font-size:.92rem}

<script>
(function(){
 var titles={fr:"Luvunga Studio – Applications et projets numériques",en:"Luvunga Studio – Apps and digital projects"};
 function set(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-'+l+']').forEach(function(e){e.innerHTML=e.getAttribute('data-'+l)});
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-set')===l?'true':'false')});
  document.title=titles[l];
 }
 document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){var l=b.getAttribute('data-set');set(l);try{localStorage.setItem('ls-lang',l)}catch(e){}})});
 var l='fr';
 try{l=localStorage.getItem('ls-lang')||''}catch(e){}
 if(l!=='fr'&&l!=='en'){l=((navigator.language||'fr').toLowerCase().indexOf('fr')===0)?'fr':'en'}
 set(l);
})();
</script>
